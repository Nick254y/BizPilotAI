<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BizPilot Briefing</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1a1d21; --muted:#6b7280; --accent:#2563eb; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a6; --accent:#60a5fa; --border:#2a2f38; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); padding:16px; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { font-size:1.3rem; margin:8px 0 16px; }
  h2 { font-size:1.05rem; margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; }
  input { width:100%; padding:12px; margin:6px 0 12px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-size:1rem; }
  button { padding:12px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--border); }
  button.link { background:none; color:var(--accent); padding:8px 0; text-decoration:underline; }
  button:disabled { opacity:.6; }
  .row { display:flex; gap:8px; margin-bottom:12px; }
  .date { color:var(--muted); font-size:.85rem; margin-bottom:8px; }
  .report { white-space:pre-wrap; line-height:1.5; }
  .msg { color:var(--muted); font-size:.9rem; margin:8px 0; }
  .err { color:#dc2626; }
  .hint { color:var(--muted); font-size:.8rem; margin:-6px 0 12px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>BizPilot Daily Briefing</h1>

  <div id="loginBox" class="card">
    <h2>Log in</h2>
    <label>Email<input id="email" type="email" autocomplete="username"></label>
    <label>Password<input id="password" type="password" autocomplete="current-password"></label>
    <button id="loginBtn">Log in</button>
    <div id="loginMsg" class="msg err"></div>
    <button id="toSignup" class="link">New here? Create an account</button>
  </div>

  <div id="signupBox" class="card hidden">
    <h2>Create account</h2>
    <label>Name<input id="suName" type="text" autocomplete="name"></label>
    <label>Email<input id="suEmail" type="email" autocomplete="username"></label>
    <label>Password<input id="suPassword" type="password" autocomplete="new-password"></label>
    <div class="hint">At least 8 characters.</div>
    <label>Confirm password<input id="suConfirm" type="password" autocomplete="new-password"></label>
    <button id="signupBtn">Create account</button>
    <div id="signupMsg" class="msg err"></div>
    <button id="toLogin" class="link">Already have an account? Log in</button>
  </div>

  <div id="appBox" class="hidden">
    <div class="row">
      <button id="runBtn">Generate now</button>
      <button id="logoutBtn" class="ghost">Log out</button>
    </div>
    <div id="status" class="msg"></div>
    <div id="reports"></div>
  </div>
</div>

<script>
const KEY = "bizpilot_token";
const $ = (id) => document.getElementById(id);

function getToken() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
function setToken(t) { try { t ? localStorage.setItem(KEY, t) : localStorage.removeItem(KEY); } catch (e) {} }

async function api(path, options) {
  const token = getToken();
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  const res = await fetch(path, Object.assign({}, options, { headers }));
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && !path.startsWith("/api/auth/")) { logout(); }
  if (!res.ok) throw new Error(data.message || "Request failed");
  return data;
}

function show(view) {
  $("loginBox").classList.toggle("hidden", view !== "login");
  $("signupBox").classList.toggle("hidden", view !== "signup");
  $("appBox").classList.toggle("hidden", view !== "app");
}

function logout() { setToken(null); show("login"); }

function renderReports(reports) {
  const box = $("reports");
  box.textContent = "";
  if (!reports.length) {
    $("status").textContent = "No briefings yet. Create a project, then tap Generate now.";
    return;
  }
  $("status").textContent = "";
  reports.forEach((r) => {
    const card = document.createElement("div");
    card.className = "card";
    const d = document.createElement("div");
    d.className = "date";
    d.textContent = r.report_date;
    const body = document.createElement("div");
    body.className = "report";
    body.textContent = String(r.content).replace(/\*\*/g, "");
    card.appendChild(d);
    card.appendChild(body);
    box.appendChild(card);
  });
}

async function loadReports() {
  $("status").textContent = "Loading...";
  try {
    const data = await api("/api/agent/reports");
    renderReports(data.reports || []);
  } catch (e) {
    $("status").textContent = e.message;
  }
}

function enterApp(token) { setToken(token); show("app"); loadReports(); }

$("toSignup").addEventListener("click", () => { $("loginMsg").textContent = ""; show("signup"); });
$("toLogin").addEventListener("click", () => { $("signupMsg").textContent = ""; show("login"); });

$("loginBtn").addEventListener("click", async () => {
  $("loginMsg").textContent = "";
  $("loginBtn").disabled = true;
  try {
    const data = await api("/api/auth/login", {
      method: "POST",
      body: JSON.stringify({ email: $("email").value, password: $("password").value })
    });
    $("password").value = "";
    enterApp(data.token);
  } catch (e) {
    $("loginMsg").textContent = e.message;
  } finally {
    $("loginBtn").disabled = false;
  }
});

$("signupBtn").addEventListener("click", async () => {
  $("signupMsg").textContent = "";
  if ($("suPassword").value !== $("suConfirm").value) {
    $("signupMsg").textContent = "Passwords do not match.";
    return;
  }
  $("signupBtn").disabled = true;
  try {
    const data = await api("/api/auth/register", {
      method: "POST",
      body: JSON.stringify({ name: $("suName").value, email: $("suEmail").value, password: $("suPassword").value })
    });
    $("suPassword").value = "";
    $("suConfirm").value = "";
    enterApp(data.token);
  } catch (e) {
    $("signupMsg").textContent = e.message;
  } finally {
    $("signupBtn").disabled = false;
  }
});

$("runBtn").addEventListener("click", async () => {
  $("runBtn").disabled = true;
  $("status").textContent = "Generating... this can take up to 30 seconds.";
  try {
    const data = await api("/api/agent/run", { method: "POST" });
    if (data.message) { $("status").textContent = data.message; }
    else { await loadReports(); }
  } catch (e) {
    $("status").textContent = e.message;
  } finally {
    $("runBtn").disabled = false;
  }
});

$("logoutBtn").addEventListener("click", logout);

if (getToken()) { show("app"); loadReports(); } else { show("login"); }
</script>
</body>
</html>
