<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BizPilot</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1a1d21; --muted:#6b7280; --accent:#2563eb; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a6; --accent:#60a5fa; --border:#2a2f38; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); padding:16px; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { font-size:1.3rem; margin:8px 0 16px; }
  h2 { font-size:1.05rem; margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; }
  input, textarea { width:100%; padding:12px; margin:6px 0 12px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-size:1rem; font-family:inherit; }
  textarea { min-height:70px; resize:vertical; margin-bottom:8px; }
  button { padding:12px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--border); }
  button.link { background:none; color:var(--accent); padding:8px 0; text-decoration:underline; }
  button.danger { background:#dc2626; }
  button:disabled { opacity:.6; }
  .row { display:flex; gap:8px; margin-bottom:12px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tabs button { flex:1; background:transparent; color:var(--accent); border:1px solid var(--border); }
  .tabs button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .date { color:var(--muted); font-size:.85rem; margin-bottom:8px; }
  .report { white-space:pre-wrap; line-height:1.5; }
  .msg { color:var(--muted); font-size:.9rem; margin:8px 0; }
  .err { color:#dc2626; }
  .ok { color:#16a34a; }
  .hint { color:var(--muted); font-size:.8rem; margin:-6px 0 12px; }
  .note { color:var(--muted); font-size:.85rem; margin:0 0 12px; }
  .chatlog { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .bubble { padding:10px 12px; border-radius:12px; max-width:90%; white-space:pre-wrap; line-height:1.45; }
  .bubble.user { align-self:flex-end; background:var(--accent); color:#fff; }
  .bubble.assistant { align-self:flex-start; background:var(--card); border:1px solid var(--border); }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>BizPilot</h1>

  <div id="loginBox" class="card">
    <h2>Log in</h2>
    <label>Email<input id="email" type="email" autocomplete="username"></label>
    <label>Password<input id="password" type="password" autocomplete="current-password"></label>
    <button id="loginBtn">Log in</button>
    <div id="loginMsg" class="msg err"></div>
    <div class="note">Forgot your password? Contact the site owner to reset it.</div>
    <button id="toSignup" class="link">New here? Create an account</button>
  </div>

  <div id="signupBox" class="card hidden">
    <h2>Create account</h2>
    <label>Name<input id="suName" type="text" autocomplete="name"></label>
    <label>Email<input id="suEmail" type="email" autocomplete="username"></label>
    <label>Password<input id="suPassword" type="password" autocomplete="new-password"></label>
    <div class="hint">8 to 72 characters.</div>
    <label>Confirm password<input id="suConfirm" type="password" autocomplete="new-password"></label>
    <button id="signupBtn">Create account</button>
    <div id="signupMsg" class="msg err"></div>
    <button id="toLogin" class="link">Already have an account? Log in</button>
  </div>

  <div id="appBox" class="hidden">
    <div class="tabs">
      <button id="tabBrief" class="active">Briefing</button>
      <button id="tabChat">Chat</button>
      <button id="tabAcct">Account</button>
    </div>

    <div id="briefPanel">
      <div class="row"><button id="runBtn">Generate now</button></div>
      <div id="status" class="msg"></div>
      <div id="reports"></div>
    </div>

    <div id="chatPanel" class="hidden">
      <div id="chatLog" class="chatlog"></div>
      <textarea id="chatInput" placeholder="Ask about your business..." maxlength="4000"></textarea>
      <div class="row">
        <button id="sendBtn">Send</button>
        <button id="clearChat" class="ghost">Clear chat</button>
      </div>
      <div id="chatMsg" class="msg"></div>
    </div>

    <div id="acctPanel" class="hidden">
      <div class="card">
        <h2>Change password</h2>
        <label>Current password<input id="curPw" type="password" autocomplete="current-password"></label>
        <label>New password<input id="newPw" type="password" autocomplete="new-password"></label>
        <label>Confirm new password<input id="newPw2" type="password" autocomplete="new-password"></label>
        <button id="changePwBtn">Change password</button>
        <div id="acctMsg" class="msg"></div>
      </div>
      <div class="card">
        <h2>Delete account</h2>
        <div class="note">This permanently deletes your account, projects, chats and briefings.</div>
        <label>Your password<input id="delPw" type="password" autocomplete="current-password"></label>
        <button id="delBtn" class="danger">Delete my account</button>
        <div id="delMsg" class="msg err"></div>
      </div>
      <button id="logoutBtn" class="ghost">Log out</button>
    </div>
  </div>
</div>

<script>
const KEY = "bizpilot_token";
const $ = (id) => document.getElementById(id);

function getToken() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
function setToken(t) { try { t ? localStorage.setItem(KEY, t) : localStorage.removeItem(KEY); } catch (e) {} }

async function api(path, options) {
  const token = getToken();
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  const res = await fetch(path, Object.assign({}, options, { headers }));
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && !path.startsWith("/api/auth/")) { logout(); }
  if (!res.ok) throw new Error(data.message || "Request failed");
  return data;
}

function show(view) {
  $("loginBox").classList.toggle("hidden", view !== "login");
  $("signupBox").classList.toggle("hidden", view !== "signup");
  $("appBox").classList.toggle("hidden", view !== "app");
}

function logout() {
  setToken(null);
  $("chatLog").textContent = "";
  $("reports").textContent = "";
  show("login");
}

const TABS = { brief: "tabBrief", chat: "tabChat", acct: "tabAcct" };

function tab(name) {
  Object.keys(TABS).forEach((n) => {
    $(n + "Panel").classList.toggle("hidden", n !== name);
    $(TABS[n]).classList.toggle("active", n === name);
  });
  if (name === "brief") loadReports();
  if (name === "chat") loadHistory();
}

function enterApp(token) { setToken(token); show("app"); tab("brief"); }

function renderReports(reports) {
  const box = $("reports");
  box.textContent = "";
  if (!reports.length) {
    $("status").textContent = "No briefings yet. Create a project, then tap Generate now.";
    return;
  }
  $("status").textContent = "";
  reports.forEach((r) => {
    const card = document.createElement("div");
    card.className = "card";
    const d = document.createElement("div");
    d.className = "date";
    d.textContent = r.report_date;
    const body = document.createElement("div");
    body.className = "report";
    body.textContent = String(r.content).replace(/\*\*/g, "");
    card.appendChild(d);
    card.appendChild(body);
    box.appendChild(card);
  });
}

async function loadReports() {
  $("status").textContent = "Loading...";
  try {
    const data = await api("/api/agent/reports");
    renderReports(data.reports || []);
  } catch (e) {
    $("status").textContent = e.message;
  }
}

function addBubble(role, text) {
  const b = document.createElement("div");
  b.className = "bubble " + role;
  b.textContent = text;
  $("chatLog").appendChild(b);
  b.scrollIntoView({ block: "end" });
}

async function loadHistory() {
  $("chatMsg").textContent = "";
  try {
    const data = await api("/api/ai/history");
    $("chatLog").textContent = "";
    const list = (data.messages || []).slice(-50);
    if (!list.length) { $("chatMsg").textContent = "No messages yet. Say hello."; }
    list.forEach((m) => addBubble(m.role, m.content));
  } catch (e) {
    $("chatMsg").textContent = e.message;
  }
}

$("tabBrief").addEventListener("click", () => tab("brief"));
$("tabChat").addEventListener("click", () => tab("chat"));
$("tabAcct").addEventListener("click", () => tab("acct"));
$("toSignup").addEventListener("click", () => { $("loginMsg").textContent = ""; show("signup"); });
$("toLogin").addEventListener("click", () => { $("signupMsg").textContent = ""; show("login"); });
$("logoutBtn").addEventListener("click", logout);

$("loginBtn").addEventListener("click", async () => {
  $("loginMsg").textContent = "";
  $("loginBtn").disabled = true;
  try {
    const data = await api("/api/auth/login", {
      method: "POST",
      body: JSON.stringify({ email: $("email").value, password: $("password").value })
    });
    $("password").value = "";
    enterApp(data.token);
  } catch (e) {
    $("loginMsg").textContent = e.message;
  } finally {
    $("loginBtn").disabled = false;
  }
});

$("signupBtn").addEventListener("click", async () => {
  $("signupMsg").textContent = "";
  if ($("suPassword").value !== $("suConfirm").value) {
    $("signupMsg").textContent = "Passwords do not match.";
    return;
  }
  $("signupBtn").disabled = true;
  try {
    const data = await api("/api/auth/register", {
      method: "POST",
      body: JSON.stringify({ name: $("suName").value, email: $("suEmail").value, password: $("suPassword").value })
    });
    $("suPassword").value = "";
    $("suConfirm").value = "";
    enterApp(data.token);
  } catch (e) {
    $("signupMsg").textContent = e.message;
  } finally {
    $("signupBtn").disabled = false;
  }
});

$("runBtn").addEventListener("click", async () => {
  $("runBtn").disabled = true;
  $("status").textContent = "Generating... this can take up to 30 seconds.";
  try {
    const data = await api("/api/agent/run", { method: "POST" });
    if (data.message) { $("status").textContent = data.message; }
    else { await loadReports(); }
  } catch (e) {
    $("status").textContent = e.message;
  } finally {
    $("runBtn").disabled = false;
  }
});

$("sendBtn").addEventListener("click", async () => {
  const text = $("chatInput").value.trim();
  if (!text) return;
  $("sendBtn").disabled = true;
  addBubble("user", text);
  $("chatInput").value = "";
  $("chatMsg").textContent = "Thinking...";
  try {
    const data = await api("/api/ai/chat", { method: "POST", body: JSON.stringify({ message: text }) });
    addBubble("assistant", data.reply);
    $("chatMsg").textContent = "";
  } catch (e) {
    $("chatInput").value = text;
    $("chatMsg").textContent = e.message;
  } finally {
    $("sendBtn").disabled = false;
  }
});

$("clearChat").addEventListener("click", async () => {
  if (!confirm("Clear your whole chat history?")) return;
  try {
    await api("/api/ai/history", { method: "DELETE" });
    $("chatLog").textContent = "";
    $("chatMsg").textContent = "Chat cleared.";
  } catch (e) {
    $("chatMsg").textContent = e.message;
  }
});

$("changePwBtn").addEventListener("click", async () => {
  const msg = $("acctMsg");
  msg.className = "msg err";
  msg.textContent = "";
  if ($("newPw").value !== $("newPw2").value) {
    msg.textContent = "New passwords do not match.";
    return;
  }
  $("changePwBtn").disabled = true;
  try {
    const data = await api("/api/auth/change-password", {
      method: "POST",
      body: JSON.stringify({ currentPassword: $("curPw").value, newPassword: $("newPw").value })
    });
    ["curPw", "newPw", "newPw2"].forEach((id) => { $(id).value = ""; });
    msg.className = "msg ok";
    msg.textContent = data.message;
  } catch (e) {
    msg.textContent = e.message;
  } finally {
    $("changePwBtn").disabled = false;
  }
});

$("delBtn").addEventListener("click", async () => {
  const msg = $("delMsg");
  msg.textContent = "";
  if (!$("delPw").value) { msg.textContent = "Enter your password to confirm."; return; }
  if (!confirm("Delete your account and all your data? This cannot be undone.")) return;
  $("delBtn").disabled = true;
  try {
    await api("/api/auth/account", { method: "DELETE", body: JSON.stringify({ password: $("delPw").value }) });
    $("delPw").value = "";
    logout();
    $("loginMsg").textContent = "Your account was deleted.";
  } catch (e) {
    msg.textContent = e.message;
  } finally {
    $("delBtn").disabled = false;
  }
});

if (getToken()) { show("app"); tab("brief"); } else { show("login"); }
</script>
</body>
</html>
